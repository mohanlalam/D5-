/* ==========================================================================
   D5 IPL Fantasy Platform — High-End iOS Mobile App Design System (v2.1)
   Features: Dynamic Island Live Widget, Floating Glass Tab Bar & Inset Groups
   ========================================================================== */

:root {
  /* iOS True Dark Palette */
  --ios-bg-base: #000000;
  --ios-bg-grouped: #000000;
  --ios-bg-secondary: #1c1c1e;
  --ios-bg-tertiary: #2c2c2e;
  --ios-bg-quaternary: #3a3a3c;
  
  --ios-glass-nav: rgba(20, 20, 22, 0.82);
  --ios-glass-card: rgba(28, 28, 30, 0.68);
  --ios-glass-sheet: rgba(24, 24, 26, 0.92);
  --ios-glass-tabbar: rgba(22, 22, 24, 0.85);
  
  --ios-separator: rgba(84, 84, 88, 0.4);
  --ios-separator-opaque: #38383a;
  
  /* Apple HIG System Accents */
  --ios-blue: #0a84ff;
  --ios-green: #30d158;
  --ios-red: #ff453a;
  --ios-orange: #ff9f0a;
  --ios-yellow: #ffd60a;
  --ios-purple: #bf5af2;
  --ios-teal: #64d2ff;
  --ios-indigo: #5e5ce6;
  --ios-pink: #ff375f;
  
  /* Typography */
  --ios-text-primary: #ffffff;
  --ios-text-secondary: rgba(235, 235, 245, 0.6);
  --ios-text-tertiary: rgba(235, 235, 245, 0.35);
  --ios-text-quaternary: rgba(235, 235, 245, 0.18);
  
  --font-ios-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", Arial, sans-serif;
  --font-ios-heading: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", Arial, sans-serif;
  
  /* Radii */
  --ios-radius-xs: 6px;
  --ios-radius-sm: 10px;
  --ios-radius-md: 14px;
  --ios-radius-lg: 20px;
  --ios-radius-xl: 28px;
  --ios-radius-full: 9999px;
  
  /* Shadows & Springs */
  --ios-shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
  --ios-shadow-dynamic: 0 8px 30px rgba(0, 0, 0, 0.6);
  --ios-shadow-tabbar: 0 -4px 24px rgba(0, 0, 0, 0.55);
  --ios-ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
  --ios-ease-smooth: cubic-bezier(0.32, 0.72, 0, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--ios-bg-base);
  color: var(--ios-text-primary);
  font-family: var(--font-ios-text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  letter-spacing: -0.2px;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: var(--ios-radius-full); }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }

/* ─── DYNAMIC ISLAND / LIVE ACTIVITY WIDGET ────────────────────────────────── */
.dynamic-island {
  background: #000000;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 28px;
  padding: 8px 18px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--ios-shadow-dynamic), 0 0 0 1px rgba(255,255,255,0.06);
  transition: all 0.3s var(--ios-ease-spring);
  cursor: pointer;
  max-width: 95vw;
}

.dynamic-island:hover {
  transform: scale(1.02);
  border-color: rgba(255, 255, 255, 0.25);
}

/* ─── FLOATING iOS BOTTOM TAB BAR ─────────────────────────────────────────── */
.ios-bottom-tabbar {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ios-glass-tabbar);
  backdrop-filter: blur(28px) saturate(200%);
  -webkit-backdrop-filter: blur(28px) saturate(200%);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--ios-radius-full);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 99;
  box-shadow: var(--ios-shadow-tabbar);
  max-width: calc(100vw - 24px);
}

.ios-tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 14px;
  border-radius: var(--ios-radius-full);
  background: transparent;
  border: none;
  color: var(--ios-text-secondary);
  cursor: pointer;
  transition: all 0.2s var(--ios-ease-smooth);
  font-size: 11px;
  font-weight: 500;
  gap: 2px;
}

.ios-tab-item.active {
  background: rgba(255, 255, 255, 0.14);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.ios-tab-item:active {
  transform: scale(0.92);
}

/* ─── SURFACES & CARDS ─────────────────────────────────────────────────────── */
.ios-glass {
  background: var(--ios-glass-card);
  backdrop-filter: blur(24px) saturate(190%);
  -webkit-backdrop-filter: blur(24px) saturate(190%);
  border: 0.5px solid rgba(255, 255, 255, 0.1);
  box-shadow: var(--ios-shadow-card);
}

.ios-glass-nav {
  background: var(--ios-glass-nav);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border-bottom: 0.5px solid var(--ios-separator);
}

.ios-inset-group {
  background: var(--ios-bg-secondary);
  border-radius: var(--ios-radius-lg);
  overflow: hidden;
  border: 0.5px solid var(--ios-separator);
}

.ios-cell {
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0.5px solid var(--ios-separator);
  transition: background-color 0.15s ease;
}

.ios-cell:last-child {
  border-bottom: none;
}

.ios-cell:active {
  background-color: var(--ios-bg-tertiary);
}

/* ─── BUTTONS & TACTILE CONTROLS ─────────────────────────────────────────── */
.ios-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font-ios-text);
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--ios-radius-full);
  border: none;
  cursor: pointer;
  padding: 9px 18px;
  transition: transform 0.18s var(--ios-ease-spring), opacity 0.15s ease;
  user-select: none;
}

.ios-btn:active:not(:disabled) {
  transform: scale(0.94);
  opacity: 0.85;
}

.ios-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.ios-btn-primary { background: var(--ios-blue); color: #ffffff; }
.ios-btn-tinted { background: rgba(10, 132, 255, 0.15); color: var(--ios-blue); }
.ios-btn-destructive { background: rgba(255, 69, 58, 0.15); color: var(--ios-red); border: 0.5px solid rgba(255, 69, 58, 0.35); }
.ios-btn-ghost { background: rgba(255, 255, 255, 0.08); color: var(--ios-text-primary); }
.ios-btn-green { background: var(--ios-green); color: #000000; font-weight: 700; }

/* ─── INPUTS ───────────────────────────────────────────────────────────────── */
.ios-input {
  background: var(--ios-bg-tertiary);
  border: 0.5px solid var(--ios-separator);
  color: var(--ios-text-primary);
  border-radius: var(--ios-radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  font-family: var(--font-ios-text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.ios-input:focus {
  border-color: var(--ios-blue);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
}

/* ─── MODAL SHEETS ─────────────────────────────────────────────────────────── */
.ios-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: iosFadeIn 0.25s var(--ios-ease-smooth);
}

@media (min-width: 768px) {
  .ios-sheet-backdrop {
    align-items: center;
  }
}

.ios-sheet-card {
  background: var(--ios-glass-sheet);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--ios-radius-xl) var(--ios-radius-xl) 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
  width: 100%;
  max-width: 860px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: iosSlideUp 0.32s var(--ios-ease-smooth);
}

@media (min-width: 768px) {
  .ios-sheet-card {
    border-radius: var(--ios-radius-xl);
    max-height: 88vh;
  }
}

.ios-grabber {
  width: 36px;
  height: 4.5px;
  background: rgba(255, 255, 255, 0.28);
  border-radius: var(--ios-radius-full);
  margin: 10px auto 4px;
}

/* ─── ROLE BADGES ──────────────────────────────────────────────────────────── */
.role-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.role-bat { background: rgba(10, 132, 255, 0.18); color: var(--ios-blue); }
.role-bowl { background: rgba(255, 69, 58, 0.18); color: var(--ios-red); }
.role-all { background: rgba(48, 209, 88, 0.18); color: var(--ios-green); }
.role-wk { background: rgba(255, 159, 10, 0.18); color: var(--ios-orange); }

/* ─── ANIMATIONS ──────────────────────────────────────────────────────────── */
@keyframes iosLivePulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.4; }
  100% { transform: scale(1); opacity: 1; }
}

.ios-pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ios-red);
  display: inline-block;
  animation: iosLivePulse 1.4s infinite ease-in-out;
}

@keyframes iosFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes iosSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── TABLES ───────────────────────────────────────────────────────────────── */
.ios-table {
  width: 100%;
  border-collapse: collapse;
}

.ios-table th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ios-text-secondary);
  border-bottom: 0.5px solid var(--ios-separator);
  background: var(--ios-bg-secondary);
}

.ios-table td {
  padding: 12px 14px;
  border-bottom: 0.5px solid var(--ios-separator);
  font-size: 14px;
}

.ios-table tr:last-child td {
  border-bottom: none;
}

</style>

function calcPts(player, mults = {}) {
  const r = mults.r ?? SCORING_RULES.multipliers.run;

  const c = mults.c ?? SCORING_RULES.multipliers.catch;
  const d = mults.d ?? SCORING_RULES.multipliers.duck;

  const runs = Number(player.runs || player.r || 0);
  const wkts = Number(player.wkts || player.w || 0);
  const runOut = Number(player.ro || 0);
  const stmp = Number(player.stmp || player.st || 0);
  const catches = Number(player.catch || player.c || 0);
  const duck = Number(player.duck || player.d || 0);

  const sixes = Number(player.b6s || player.bs || 0);
  const bW6 = Number(player.bW6 || player.bw6 || 0);
  const bHtkW = Number(player.bHtkW || player.bh || 0);
  const bHtk6s = Number(player.bHtk6s || player.bh6 || 0);
  const bMdn = Number(player.bMdn || player.bm || 0);

  const base = (runs * r) + (wkts * w) + (runOut * ro) + (stmp * st) + (catches * c) + (duck * d);

  const bw6 = bW6 * 100;

  const bonus = br + bw + bc + bro + bSix + bw6 + bHtk + bMaiden;
  const raw = base + bonus;
  return (player.isCaptain || player.cap) ? raw * 2 : raw;
}

}

        const newOvers = `${Math.floor(currentBalls / 6)}.${currentBalls % 6}`;

          teams.forEach((other) => {
            if (other.id !== winnerId) diffSum += (scores[winnerId] || 0) - (scores[other.id] || 0);

        wins,
        grandPoints,
        rawPointsTotal,
        bestMatch,

// ─── MANUAL MATCH & PLAYER SELECTION SUITE ────────────────────────────────────

function IOSManualMatchEditor({ entry, teams, onSave, onCancel }) {
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(entry)));
  const [activeTeamId, setActiveTeamId] = useState(teams[0]?.id || "T1");

  // Flattened player list across all IPL squads for easy selection
  const allIplPlayers = useMemo(() => {
    const list = [];
    Object.entries(IPL_SQUADS).forEach(([teamCode, squad]) => {
      squad.forEach((p) => {
        list.push({ name: p.name, role: p.role, teamCode });
      });
    });
    return list;
  }, []);

  const updatePlayerField = (teamId, playerIdx, field, val) => {
    setDraft((prev) => {
      const next = JSON.parse(JSON.stringify(prev));
      next.teamData[teamId][playerIdx][field] = val;
      return next;
    });
  };

  const toggleCaptain = (teamId, playerIdx) => {
    hapticFeedback(15);
    setDraft((prev) => {
      const next = JSON.parse(JSON.stringify(prev));
      next.teamData[teamId].forEach((p, idx) => {
        p.isCaptain = idx === playerIdx;
      });
      return next;
    });
  };

  // Compute live preview of points in modal
  const teamTotals = useMemo(() => {
    return teams.reduce((acc, t) => {
      const roster = draft.teamData[t.id] || [];
      acc[t.id] = roster.reduce((sum, p) => sum + calcPts(p), 0);
      return acc;
    }, {});
  }, [draft, teams]);

  return h("div", { style: { display: "flex", flexDirection: "column", gap: "16px" } },
    // Step 1: Match Setup Header
    h("div", { style: { background: "var(--ios-bg-secondary)", borderRadius: "var(--ios-radius-lg)", padding: "14px", border: "0.5px solid var(--ios-separator)" } },
      h("div", { style: { fontSize: "12px", fontWeight: "700", color: "var(--ios-teal)", textTransform: "uppercase", marginBottom: "8px" } }, "1. Match Details"),
      h("div", { style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: "10px" } },
        h("div", null,
          h("label", { style: { fontSize: "11px", color: "var(--ios-text-secondary)", fontWeight: "600", display: "block", marginBottom: "4px" } }, "MATCH TITLE / FIXTURE"),
          h("input", {
            className: "ios-input",
            type: "text",
            value: draft.matchLabel || "",
            onChange: (e) => setDraft({ ...draft, matchLabel: e.target.value }),
            placeholder: "e.g. Match 1 - CSK vs MI",
            style: { width: "100%" }
          })
        ),
        h("div", null,
          h("label", { style: { fontSize: "11px", color: "var(--ios-text-secondary)", fontWeight: "600", display: "block", marginBottom: "4px" } }, "DATE"),
          h("input", {
            className: "ios-input",
            type: "date",
            value: draft.date || "",
            onChange: (e) => setDraft({ ...draft, date: e.target.value }),
            style: { width: "100%" }
          })
        ),
        h("div", null,
          h("label", { style: { fontSize: "11px", color: "var(--ios-text-secondary)", fontWeight: "600", display: "block", marginBottom: "4px" } }, "QUICK PRESET"),
          h("select", {
            className: "ios-input",
            style: { width: "100%" },
            onChange: (e) => {
              const fix = IPL_SCHEDULE_2027.find((m) => m.id === e.target.value);
              if (fix) {
                setDraft({
                  ...draft,
                  matchLabel: `${fix.team1} vs ${fix.team2}`,
                  date: fix.date,
                });
              }
            }
          },
            h("option", { value: "" }, "Select Fixture..."),
            IPL_SCHEDULE_2027.map((m) => h("option", { key: m.id, value: m.id }, `${m.team1} vs ${m.team2} (${m.date})`))
          )
        )
      )
    ),

    // Step 2: Fantasy Team Switcher Tabs with Live Totals
    h("div", { style: { display: "flex", gap: "8px", overflowX: "auto", paddingBottom: "4px" } },
      teams.map((t) => {
        const isSel = activeTeamId === t.id;
        const total = teamTotals[t.id] || 0;
        return h("button", {
          key: t.id,
          onClick: () => setActiveTeamId(t.id),
          style: {
            padding: "9px 16px",
            borderRadius: "var(--ios-radius-md)",
            border: isSel ? `1.5px solid ${t.color}` : "0.5px solid var(--ios-separator)",
            background: isSel ? `${t.color}22` : "var(--ios-bg-secondary)",
            color: isSel ? t.color : "var(--ios-text-secondary)",
            fontWeight: "700",
            fontSize: "13px",
            cursor: "pointer",
            display: "flex",
            alignItems: "center",
            gap: "8px",
            flexShrink: 0,
          }
        },
          h("span", { style: { width: "8px", height: "8px", borderRadius: "50%", background: t.color } }),
          `${t.name}: `,
          h("span", { style: { color: "#fff", fontWeight: "800" } }, `${total} pts`)
        );
      })
    ),

    // Step 3: Player Selection Roster & Stats Grid for Active Team
    h("div", { style: { display: "flex", flexDirection: "column", gap: "10px" } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("div", { style: { fontSize: "12px", fontWeight: "700", color: "var(--ios-orange)", textTransform: "uppercase" } },
          `2. ${teams.find((t) => t.id === activeTeamId)?.name} 5-Player Roster & Match Stats`
        ),
        h("span", { style: { fontSize: "11px", color: "var(--ios-text-secondary)" } },
          "💡 Type player name or pick from dropdown • Click ★ to set Captain (2×)"
        )
      ),

      (draft.teamData[activeTeamId] || []).map((player, pIdx) => {
        const pts = calcPts(player);
        return h("div", {
          key: player.id || pIdx,
          style: {
            background: "var(--ios-bg-secondary)",
            border: player.isCaptain ? "1px solid var(--ios-yellow)" : "0.5px solid var(--ios-separator)",
            borderRadius: "var(--ios-radius-md)",
            padding: "12px",
            display: "grid",
            gridTemplateColumns: "180px 1fr 1fr 1fr 1fr 1fr 50px 75px",
            gap: "8px",
            alignItems: "center",
          }
        },
          // Player Name & Captain Picker
          h("div", null,
            h("input", {
              className: "ios-input",
              list: `ipl-players-${activeTeamId}-${pIdx}`,
              type: "text",
              value: player.name || "",
              onChange: (e) => updatePlayerField(activeTeamId, pIdx, "name", e.target.value),
              placeholder: `Player ${pIdx + 1}`,
              style: { width: "100%", padding: "6px 8px", fontSize: "13px", fontWeight: "600" }
            }),
            h("datalist", { id: `ipl-players-${activeTeamId}-${pIdx}` },
              allIplPlayers.map((p, idx) => h("option", { key: idx, value: p.name }, `${p.teamCode} - ${p.role}`))
            ),
            h("button", {
              onClick: () => toggleCaptain(activeTeamId, pIdx),
              style: {
                background: "none", border: "none",
                color: player.isCaptain ? "var(--ios-yellow)" : "var(--ios-text-tertiary)",
                fontSize: "11px", fontWeight: "700", cursor: "pointer", marginTop: "4px", display: "block"
              }
            }, player.isCaptain ? "★ Captain (2× Multiplier)" : "☆ Set as Captain")
          ),
          h(IOSNumberInput, { label: "Runs (+5)", value: player.runs || 0, onChange: (v) => updatePlayerField(activeTeamId, pIdx, "runs", v) }),
          h(IOSNumberInput, { label: "Wkts (+100)", value: player.wkts || 0, onChange: (v) => updatePlayerField(activeTeamId, pIdx, "wkts", v) }),
          h(IOSNumberInput, { label: "Catches (+50)", value: player.catch || 0, onChange: (v) => updatePlayerField(activeTeamId, pIdx, "catch", v) }),
          h(IOSNumberInput, { label: "RO/St (+50)", value: (player.ro || 0) + (player.stmp || 0), onChange: (v) => updatePlayerField(activeTeamId, pIdx, "ro", v) }),
          h(IOSNumberInput, { label: "Sixes (Bonus)", value: player.b6s || 0, onChange: (v) => updatePlayerField(activeTeamId, pIdx, "b6s", v) }),
          h(IOSNumberInput, { label: "Duck (-50)", value: player.duck || 0, min: 0, max: 1, onChange: (v) => updatePlayerField(activeTeamId, pIdx, "duck", v) }),
          h("div", { style: { textAlign: "right", fontWeight: "800", fontSize: "17px", color: player.isCaptain ? "var(--ios-yellow)" : "var(--ios-green)" } },
            `${pts} pts`
          )
        );
      })
    ),

    // Footer actions & Live Winner Preview
    h("div", {
      style: {
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        borderTop: "0.5px solid var(--ios-separator)",
        paddingTop: "14px",
        marginTop: "10px",
      }
    },
      h("div", { style: { fontSize: "13px", color: "var(--ios-text-secondary)" } },
        "Match Total Points: ",
        Object.entries(teamTotals).map(([tId, pts]) => {
          const t = teams.find((tm) => tm.id === tId);
          return h("span", { key: tId, style: { color: t?.color || "#fff", fontWeight: "700", marginRight: "10px" } },
            `${t?.name}: ${pts}`
          );
        })
      ),
      h("div", { style: { display: "flex", gap: "10px" } },
        h(IOSButton, { variant: "ghost", onClick: onCancel }, "Cancel"),
        h(IOSButton, { variant: "primary", onClick: () => onSave(draft) }, "💾 Save Match Scorecard")
      )
    )
  );
}

// ─── REGISTER SERVICE WORKER & BOOTSTRAP ─────────────────────────────────────
if (typeof navigator !== "undefined" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
const loadingEl = document.getElementById("loading");
if (loadingEl) loadingEl.style.display = "none";

</script>
</body>
</html>
